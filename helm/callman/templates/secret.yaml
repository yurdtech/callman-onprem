{{- include "callman.validateSecrets" . -}}
{{- if not .Values.secrets.existingSecret }}
# Chart-managed secret (rendered only when secrets.existingSecret is unset).
# Keys are the exact env names the processes read — the same names a
# customer-managed existingSecret must use.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "callman.secretName" . }}
  labels:
    {{- include "callman.labels" (dict "root" $ "component" "config") | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secrets.values.JWT_SECRET | quote }}
  JWT_REFRESH_SECRET: {{ .Values.secrets.values.JWT_REFRESH_SECRET | quote }}
  SESSION_TOKEN_ENCRYPTION_SECRET: {{ .Values.secrets.values.SESSION_TOKEN_ENCRYPTION_SECRET | quote }}
  CONNECTION_ENCRYPTION_KEY: {{ .Values.secrets.values.CONNECTION_ENCRYPTION_KEY | quote }}
  ADMIN_JWT_SECRET: {{ .Values.secrets.values.ADMIN_JWT_SECRET | quote }}
  ADMIN_JWT_REFRESH_SECRET: {{ .Values.secrets.values.ADMIN_JWT_REFRESH_SECRET | quote }}
  {{- with .Values.secrets.values.ADMIN_BOOTSTRAP_EMAIL }}
  ADMIN_BOOTSTRAP_EMAIL: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.values.ADMIN_BOOTSTRAP_PASSWORD }}
  ADMIN_BOOTSTRAP_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- if .Values.mongo.enabled }}
  MONGO_ROOT_PASSWORD: {{ required "secrets.values.MONGO_ROOT_PASSWORD is required with the bundled mongo" .Values.secrets.values.MONGO_ROOT_PASSWORD | quote }}
  {{- end }}
  {{- if .Values.redis.enabled }}
  REDIS_PASSWORD: {{ required "secrets.values.REDIS_PASSWORD is required with the bundled redis" .Values.secrets.values.REDIS_PASSWORD | quote }}
  {{- end }}
  MONGODB_URI: {{ include "callman.mongoUri" . | quote }}
  REDIS_URL: {{ include "callman.redisUrl" . | quote }}
  CALLMAN_MONGODB_URI: {{ .Values.admin.mongodbUri | default (include "callman.mongoUri" .) | quote }}
{{- end }}
{{- if .Values.imageCredentials.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "callman.fullname" . }}-registry
  labels:
    {{- include "callman.labels" (dict "root" $ "component" "config") | nindent 4 }}
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {{ printf "{\"auths\":{%s:{\"username\":%s,\"password\":%s,\"auth\":%s}}}" (.Values.imageCredentials.registry | quote) (.Values.imageCredentials.username | quote) (.Values.imageCredentials.password | quote) (printf "%s:%s" .Values.imageCredentials.username .Values.imageCredentials.password | b64enc | quote) }}
{{- end }}
