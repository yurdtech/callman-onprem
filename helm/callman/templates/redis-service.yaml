{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "callman.fullname" . }}-redis
  labels:
    {{- include "callman.labels" (dict "root" $ "component" "redis") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: redis
  selector:
    {{- include "callman.selectorLabels" (dict "root" $ "component" "redis") | nindent 4 }}
{{- end }}
