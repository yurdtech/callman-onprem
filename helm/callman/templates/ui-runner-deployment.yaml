{{- if .Values.uiRunner.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "callman.fullname" . }}-ui-runner
  labels:
    {{- include "callman.labels" (dict "root" $ "component" "ui-runner") | nindent 4 }}
spec:
  {{- if not .Values.uiRunner.hpa.enabled }}
  replicas: {{ .Values.uiRunner.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "callman.selectorLabels" (dict "root" $ "component" "ui-runner") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "callman.selectorLabels" (dict "root" $ "component" "ui-runner") | nindent 8 }}
      {{- with .Values.uiRunner.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "callman.serviceAccountName" . }}
      # Browser runs take minutes; the grace period must exceed the runner's
      # own drain budget (uiRunner.drainTimeoutMs → SHUTDOWN_TIMEOUT_MS below)
      # or the kubelet SIGKILLs mid-run on every rollout.
      terminationGracePeriodSeconds: {{ add (div (int .Values.uiRunner.drainTimeoutMs) 1000) 30 }}
      {{- include "callman.imagePullSecrets" . | nindent 6 }}
      {{- include "callman.podSecurityContext" . | nindent 6 }}
      containers:
        - name: ui-runner
          image: {{ include "callman.image" (dict "root" $ "image" .Values.uiRunner.image) }}
          # `args`, not `command`: the image's ENTRYPOINT (tini) stays PID 1 and
          # reaps the Chromium helper processes a crashed tab leaves behind.
          args: ["node", "dist/ui-runner.js"]
          {{- include "callman.containerSecurityContext" . | nindent 10 }}
          ports:
            - name: health
              containerPort: {{ .Values.uiRunner.healthPort }}
          {{- include "callman.sharedEnvFrom" . | nindent 10 }}
          env:
            - name: CALLMAN_WEB_DRIVER_NO_SANDBOX
              value: "1"
            # Container-level env wins over the shared ConfigMap's
            # SHUTDOWN_TIMEOUT_MS (which is sized for API-scenario runs).
            - name: SHUTDOWN_TIMEOUT_MS
              value: {{ .Values.uiRunner.drainTimeoutMs | quote }}
            - name: NODE_OPTIONS
              value: {{ printf "--max-old-space-size=%d" (int .Values.uiRunner.heapMb) | quote }}
            - name: MONGODB_MAX_POOL_SIZE
              value: {{ .Values.uiRunner.mongoPool.max | quote }}
            - name: MONGODB_MIN_POOL_SIZE
              value: {{ .Values.uiRunner.mongoPool.min | quote }}
            # The Playwright image ships Chromium, not Google Chrome — skip the
            # doomed `channel: chrome` launch attempt every run used to pay.
            - name: UITEST_BROWSER_CHANNEL
              value: bundled
            {{- with .Values.uiRunner.extraEnv }}
            {{- include "callman.extraEnv" . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /health/live
              port: health
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          {{- with .Values.uiRunner.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            # Chromium shared memory. In-memory emptyDir counts against the
            # container memory limit (the runner also launches Chromium with
            # --disable-dev-shm-usage, so this no longer needs to be 2Gi).
            - name: dshm
              mountPath: /dev/shm
            {{- include "callman.certsMount" . | nindent 12 }}
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.uiRunner.shmSize }}
        {{- include "callman.certsVolume" . | nindent 8 }}
      {{- with .Values.uiRunner.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.uiRunner.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.uiRunner.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
