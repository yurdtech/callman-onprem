{{- if and .Values.storage.enabled .Values.storage.localVolume.enabled }}
# Files for the "Local volume" storage provider — the fallback that exists so a
# fresh install works before an object store is connected. It is NOT the
# recommended target: it makes the gateway stateful and takes the files out of
# the customer's own backup regime. Connect S3 / MinIO / FileNet in the admin
# panel and leave `storage.localVolume.enabled=false`.
#
# ⚠ ReadWriteMany is REQUIRED with this provider now, not just for scaling: the
# API Deployment mounts this claim as well as the gateway, because desktop release
# artifacts are written and served by the API process (panel uploads in, desktops'
# update feed reads out). With RWO the two pods cannot both mount it unless they
# land on the same node, and a release uploaded to one would be invisible to the
# other. Connect S3 / MinIO instead if RWX is not available.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "callman.fullname" . }}-storage-files
  labels:
    {{- include "callman.labels" (dict "root" $ "component" "storage") | nindent 4 }}
  annotations:
    # Survives helm uninstall — user files must outlive the release.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    {{- toYaml .Values.storage.localVolume.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.storage.localVolume.size }}
  {{- with .Values.storage.localVolume.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
{{- end }}
