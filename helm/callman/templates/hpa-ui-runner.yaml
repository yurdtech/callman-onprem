{{- if and .Values.uiRunner.enabled .Values.uiRunner.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "callman.fullname" . }}-ui-runner
  labels:
    {{- include "callman.labels" (dict "root" $ "component" "ui-runner") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "callman.fullname" . }}-ui-runner
  minReplicas: {{ .Values.uiRunner.hpa.minReplicas }}
  maxReplicas: {{ .Values.uiRunner.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.uiRunner.hpa.targetCPUUtilizationPercentage }}
{{- end }}
