{{- include "callman.validateTopology" . -}}
# Shared non-secret env for the backend family (backend, worker, migrate,
# ui-runner, storage, mock). Compose parity: one .env consumed by every service —
# unknown vars are ignored by each process's schema.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "callman.fullname" . }}-env
  labels:
    {{- include "callman.labels" (dict "root" $ "component" "config") | nindent 4 }}
data:
  CALLMAN_EDITION: onprem
  NODE_ENV: production
  PORT: {{ .Values.backend.port | quote }}
  WORKER_HEALTH_PORT: {{ .Values.worker.healthPort | quote }}
  UITEST_HEALTH_PORT: {{ .Values.uiRunner.healthPort | quote }}
  METRICS_ENABLED: {{ .Values.backend.metricsEnabled | quote }}
  LOG_LEVEL: {{ .Values.backend.logLevel | default "info" | quote }}
  BULLMQ_WORKER_CONCURRENCY: {{ .Values.worker.concurrency | quote }}
  SHUTDOWN_TIMEOUT_MS: {{ .Values.worker.shutdownTimeoutMs | quote }}
  UITEST_WORKER_CONCURRENCY: {{ .Values.uiRunner.concurrency | quote }}
  UITEST_RUN_MAX_DURATION_MS: {{ .Values.uiRunner.runMaxDurationMs | quote }}
  {{- if .Values.storage.enabled }}
  # Storage gateway. Set even on the other pods so the API can build download
  # links pointing at the gateway (compose parity: one shared env).
  CALLMAN_STORAGE_PORT: {{ .Values.storage.port | quote }}
  CALLMAN_STORAGE_HEALTH_PORT: {{ .Values.storage.healthPort | quote }}
  STORAGE_MAX_UPLOAD_BYTES: {{ .Values.storage.maxUploadBytes | quote }}
  {{- with .Values.storage.publicUrl }}
  CALLMAN_STORAGE_PUBLIC_URL: {{ . | quote }}
  {{- end }}
  {{- end }}
  # Redis is always present in this chart (bundled or external); the login /
  # error-report rate limiters default to Mongo buckets otherwise, which is
  # two extra Mongo round-trips per login.
  RATE_LIMIT_STORE: redis
  # Scenario DB connection pooling (values: dbPool).
  DB_POOL_ENABLED: {{ .Values.dbPool.enabled | quote }}
  DB_POOL_MAX_PER_CONNECTION: {{ .Values.dbPool.maxPerConnection | int64 | quote }}
  DB_POOL_IDLE_MS: {{ .Values.dbPool.idleMs | int64 | quote }}
  DB_POOL_ACQUIRE_TIMEOUT_MS: {{ .Values.dbPool.acquireTimeoutMs | int64 | quote }}
  # Load Testing Lab (values: loadLab).
  LOAD_LAB_ENABLED: {{ .Values.loadLab.enabled | quote }}
  LOAD_LAB_MAX_TOTAL_RUNS: {{ .Values.loadLab.maxTotalRuns | int64 | quote }}
  LOAD_LAB_MAX_RUNS_PER_POD: {{ .Values.loadLab.maxRunsPerPod | int64 | quote }}
  LOAD_LAB_ARM_TIMEOUT_MS: {{ .Values.loadLab.armTimeoutMs | int64 | quote }}
  LOAD_LAB_START_LEAD_MS: {{ .Values.loadLab.startLeadMs | int64 | quote }}
  LOAD_LAB_SAMPLES_PER_GROUP: {{ .Values.loadLab.samplesPerGroup | int64 | quote }}
  # libuv thread pool (bcrypt, crypto, DNS, zlib). Node's default 4 is the
  # bottleneck during a login burst; 8 is safe at the pods' CPU requests.
  UV_THREADPOOL_SIZE: "8"
  # BullMQ job lock: renewed at half this interval. 120 s (code default 60 s)
  # halves the lock-renewal traffic and, together with the stalled-job
  # tolerance in the worker, keeps a single long GC pause / sync script from
  # turning a healthy run into a `failed` report.
  BULLMQ_LOCK_DURATION_MS: "120000"
  # Empty string disables the Telegram reporter (a literal "false" would not).
  TELEGRAM_ENABLED: ""
  {{- with .Values.backend.clientOrigin }}
  CLIENT_ORIGIN: {{ . | quote }}
  {{- end }}
  {{- with .Values.backend.publicApiBaseUrl }}
  PUBLIC_API_BASE_URL: {{ . | quote }}
  {{- end }}
  {{- with (include "callman.mock.publicUrl" .) }}
  # Where mocks are published (`<base>/mock/<id>`): mock.publicUrl, else the
  # mock Ingress/Route's own host. Unset when mocks share the backend's host —
  # the backend then uses PUBLIC_API_BASE_URL.
  MOCK_PUBLIC_BASE_URL: {{ . | quote }}
  {{- end }}
  {{- if .Values.mock.enabled }}
  CALLMAN_MOCK_PORT: {{ .Values.mock.port | quote }}
  CALLMAN_MOCK_HEALTH_PORT: {{ .Values.mock.healthPort | quote }}
  MOCK_IP_RATE_LIMIT_PER_SECOND: {{ .Values.mock.ipRateLimitPerSecond | quote }}
  {{- end }}
  # "false" once an Ingress/Route sends /mock/* to the mock pods: the API then
  # answers stray /mock requests with a 307 to the mock server and never runs a
  # mock itself. "true" (no route to the mock pods) keeps mocks working on the
  # API as before.
  MOCK_SERVE_ON_API: {{ ternary "false" "true" (eq (include "callman.mock.routed" .) "true") | quote }}
  # Mock engine v2 limits (mock.limits). Rendered for every pod, mock.enabled or
  # not: the API validates definitions/imports against them and serves /mock/*
  # itself until the mock pods are routed. A key set to null is left out (the
  # backend default applies) rather than rendered as "0". `int64` keeps large
  # values out of Helm's float notation ("2.097152e+06").
  {{- with .Values.mock.limits }}
  {{- $envByKey := dict
        "maxResourcesPerMock" "MOCK_MAX_RESOURCES_PER_MOCK"
        "maxRecordsPerResource" "MOCK_MAX_RECORDS_PER_RESOURCE"
        "maxRecordsPerNamespace" "MOCK_MAX_RECORDS_PER_NAMESPACE"
        "maxRecordBytes" "MOCK_MAX_RECORD_BYTES"
        "maxSeedBytes" "MOCK_MAX_SEED_BYTES"
        "maxSessionsPerMock" "MOCK_MAX_SESSIONS_PER_MOCK"
        "sessionIdleTtlMinutes" "MOCK_SESSION_IDLE_TTL_MINUTES"
        "maxDataOpsPerRequest" "MOCK_MAX_DATA_OPS_PER_REQUEST"
        "dataQueryTimeoutMs" "MOCK_DATA_QUERY_TIMEOUT_MS"
        "maxImportBytes" "MOCK_MAX_IMPORT_BYTES" }}
  {{- $limits := . }}
  {{- range $key, $env := $envByKey }}
  {{- $value := get $limits $key }}
  {{- if not (or (kindIs "invalid" $value) (eq (toString $value) "")) }}
  {{ $env }}: {{ $value | int64 | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- with .Values.backend.onpremCompanySlug }}
  ONPREM_COMPANY_SLUG: {{ . | quote }}
  {{- end }}
  {{- with .Values.backend.httpRequestTimeoutMs }}
  HTTP_REQUEST_TIMEOUT_MS: {{ . | quote }}
  {{- end }}
