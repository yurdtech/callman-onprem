apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "callman.fullname" . }}-backend
  labels:
    {{- include "callman.labels" (dict "root" $ "component" "backend") | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "callman.selectorLabels" (dict "root" $ "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "callman.selectorLabels" (dict "root" $ "component" "backend") | nindent 8 }}
      {{- with .Values.backend.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "callman.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.backend.terminationGracePeriodSeconds }}
      {{- include "callman.imagePullSecrets" . | nindent 6 }}
      {{- include "callman.podSecurityContext" . | nindent 6 }}
      containers:
        - name: backend
          image: {{ include "callman.image" (dict "root" $ "image" .Values.backend.image) }}
          # `args`, not `command`: keeps the image ENTRYPOINT (tini) as PID 1.
          args: ["node", "dist/server.js"]
          {{- include "callman.containerSecurityContext" . | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
          {{- include "callman.sharedEnvFrom" . | nindent 10 }}
          env:
            - name: NODE_OPTIONS
              value: {{ printf "--max-old-space-size=%d" (int .Values.backend.heapMb) | quote }}
            - name: MONGODB_MAX_POOL_SIZE
              value: {{ .Values.backend.mongoPool.max | quote }}
            - name: MONGODB_MIN_POOL_SIZE
              value: {{ .Values.backend.mongoPool.min | quote }}
            {{- with .Values.backend.extraEnv }}
            {{- include "callman.extraEnv" . | nindent 12 }}
            {{- end }}
          # Absorbs the first-install window while the migrate Job is still
          # running (the pending-migration self-guard exits the process).
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          {{- with .Values.backend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if and .Values.storage.enabled .Values.storage.localVolume.enabled }}
            # The "Local volume" provider's files. The API needs them too, not
            # just the gateway: desktop release artifacts are written and served
            # by THIS process (the admin panel uploads through it, the desktops'
            # update feed reads through it). Without the mount the API writes into
            # its own pod filesystem — the upload looks successful, the bytes go
            # when the pod does, and another replica serves 404s for them.
            #
            # This is why the PVC needs ReadWriteMany with this provider: two
            # Deployments mount it. See storage.localVolume.accessModes.
            - name: files
              mountPath: {{ .Values.storage.localVolume.mountPath }}
            {{- end }}
            {{- include "callman.certsMount" . | nindent 12 }}
      volumes:
        {{- if and .Values.storage.enabled .Values.storage.localVolume.enabled }}
        - name: files
          persistentVolumeClaim:
            claimName: {{ include "callman.fullname" . }}-storage-files
        {{- end }}
        {{- include "callman.certsVolume" . | nindent 8 }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
