{{- if .Values.admin.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "callman.fullname" . }}-admin
  labels:
    {{- include "callman.labels" (dict "root" $ "component" "admin") | nindent 4 }}
  annotations:
    {{- include "callman.ingressTransferAnnotations" (dict "annotations" .Values.admin.ingress.annotations "mode" "upload") | nindent 4 }}
spec:
  {{- with .Values.admin.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ required "admin.ingress.host is required when admin.ingress.enabled" .Values.admin.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "callman.fullname" . }}-admin
                port:
                  name: http
  {{- with .Values.admin.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
