apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "callman.fullname" . }}-worker
  labels:
    {{- include "callman.labels" (dict "root" $ "component" "worker") | nindent 4 }}
spec:
  {{- if not .Values.worker.hpa.enabled }}
  replicas: {{ .Values.worker.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "callman.selectorLabels" (dict "root" $ "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "callman.selectorLabels" (dict "root" $ "component" "worker") | nindent 8 }}
      {{- with .Values.worker.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "callman.serviceAccountName" . }}
      # Must exceed SHUTDOWN_TIMEOUT_MS so the BullMQ drain finishes before
      # the kubelet kills the pod — derived, not hardcoded.
      terminationGracePeriodSeconds: {{ add (div (int .Values.worker.shutdownTimeoutMs) 1000) 15 }}
      {{- include "callman.imagePullSecrets" . | nindent 6 }}
      {{- include "callman.podSecurityContext" . | nindent 6 }}
      containers:
        - name: worker
          image: {{ include "callman.image" (dict "root" $ "image" .Values.backend.image) }}
          # `args`, not `command`: keeps the image ENTRYPOINT (tini) as PID 1,
          # so orphaned child processes are reaped and SIGTERM reaches Node.
          args: ["node", "dist/worker.js"]
          {{- include "callman.containerSecurityContext" . | nindent 10 }}
          ports:
            - name: health
              containerPort: {{ .Values.worker.healthPort }}
          {{- include "callman.sharedEnvFrom" . | nindent 10 }}
          env:
            - name: NODE_OPTIONS
              value: {{ printf "--max-old-space-size=%d" (int .Values.worker.heapMb) | quote }}
            - name: MONGODB_MAX_POOL_SIZE
              value: {{ .Values.worker.mongoPool.max | quote }}
            - name: MONGODB_MIN_POOL_SIZE
              value: {{ .Values.worker.mongoPool.min | quote }}
            {{- with .Values.worker.extraEnv }}
            {{- include "callman.extraEnv" . | nindent 12 }}
            {{- end }}
          # The health server binds before Mongo/migrations/schedule-sync run,
          # so startup only waits for the process itself; the budget still
          # covers a slow image pull + cold node (5 s × 60 = 5 min).
          startupProbe:
            httpGet:
              path: /health/live
              port: health
            periodSeconds: 5
            failureThreshold: 60
          # Liveness is served from the same event loop the jobs run on. A
          # sync script or a large report serialisation can hold the loop for
          # seconds; only a loop blocked for ~2 minutes (6 × 20 s) is treated
          # as a hung process.
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          {{- with .Values.worker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if and .Values.worker.mountBackups .Values.migrate.backup.enabled }}
            - name: backups
              mountPath: /backups
            {{- end }}
            {{- include "callman.certsMount" . | nindent 12 }}
      volumes:
        {{- if and .Values.worker.mountBackups .Values.migrate.backup.enabled }}
        - name: backups
          persistentVolumeClaim:
            claimName: {{ include "callman.fullname" . }}-backups
        {{- end }}
        {{- include "callman.certsVolume" . | nindent 8 }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
