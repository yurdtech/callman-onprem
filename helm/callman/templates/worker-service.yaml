# Health/metrics only (the worker serves no API) — exists for ServiceMonitor
# scraping and NetworkPolicy addressing.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "callman.fullname" . }}-worker
  labels:
    {{- include "callman.labels" (dict "root" $ "component" "worker") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: health
      port: {{ .Values.worker.healthPort }}
      targetPort: health
  selector:
    {{- include "callman.selectorLabels" (dict "root" $ "component" "worker") | nindent 4 }}
