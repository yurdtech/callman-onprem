{{- if and .Values.loadLab.enabled .Values.loadLabWorker.enabled }}
# Dedicated Load Testing Lab pods: the backend image running the worker with
# WORKER_QUEUES=load-lab, so lab shards (and only they) run here and a burst
# never sits in front of production schedules. One shard per pod; capacity =
# replicaCount × maxRunsPerPod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "callman.fullname" . }}-load-lab-worker
  labels:
    {{- include "callman.labels" (dict "root" $ "component" "load-lab-worker") | nindent 4 }}
spec:
  replicas: {{ .Values.loadLabWorker.replicaCount }}
  selector:
    matchLabels:
      {{- include "callman.selectorLabels" (dict "root" $ "component" "load-lab-worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "callman.selectorLabels" (dict "root" $ "component" "load-lab-worker") | nindent 8 }}
      {{- with .Values.loadLabWorker.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "callman.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ add (div (int .Values.loadLabWorker.shutdownTimeoutMs) 1000) 15 }}
      {{- include "callman.imagePullSecrets" . | nindent 6 }}
      {{- include "callman.podSecurityContext" . | nindent 6 }}
      containers:
        - name: load-lab-worker
          image: {{ include "callman.image" (dict "root" $ "image" .Values.backend.image) }}
          args: ["node", "dist/worker.js"]
          {{- include "callman.containerSecurityContext" . | nindent 10 }}
          ports:
            - name: health
              containerPort: {{ .Values.loadLabWorker.healthPort }}
          {{- include "callman.sharedEnvFrom" . | nindent 10 }}
          env:
            - name: WORKER_QUEUES
              value: "load-lab"
            - name: WORKER_HEALTH_PORT
              value: {{ .Values.loadLabWorker.healthPort | quote }}
            - name: SHUTDOWN_TIMEOUT_MS
              value: {{ .Values.loadLabWorker.shutdownTimeoutMs | quote }}
            - name: NODE_OPTIONS
              value: {{ printf "--max-old-space-size=%d" (int .Values.loadLabWorker.heapMb) | quote }}
            - name: UV_THREADPOOL_SIZE
              value: {{ .Values.loadLabWorker.uvThreadpoolSize | quote }}
            - name: MONGODB_MAX_POOL_SIZE
              value: {{ .Values.loadLabWorker.mongoPool.max | quote }}
            - name: MONGODB_MIN_POOL_SIZE
              value: {{ .Values.loadLabWorker.mongoPool.min | quote }}
            {{- with .Values.loadLabWorker.maxRunsPerPod }}
            - name: LOAD_LAB_MAX_RUNS_PER_POD
              value: {{ . | int64 | quote }}
            {{- end }}
            {{- with .Values.loadLabWorker.extraEnv }}
            {{- include "callman.extraEnv" . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /health/live
              port: health
            periodSeconds: 5
            failureThreshold: 60
          # A shard firing hundreds of runs keeps the loop busy in bursts;
          # only a loop blocked for ~2 minutes counts as hung.
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          {{- with .Values.loadLabWorker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- include "callman.certsMount" . | nindent 12 }}
      volumes:
        {{- include "callman.certsVolume" . | nindent 8 }}
      {{- with .Values.loadLabWorker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.loadLabWorker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.loadLabWorker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
