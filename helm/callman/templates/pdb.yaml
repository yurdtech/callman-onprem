{{- if .Values.backend.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "callman.fullname" . }}-backend
  labels:
    {{- include "callman.labels" (dict "root" $ "component" "backend") | nindent 4 }}
spec:
  minAvailable: {{ .Values.backend.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "callman.selectorLabels" (dict "root" $ "component" "backend") | nindent 6 }}
{{- end }}
{{- if .Values.worker.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "callman.fullname" . }}-worker
  labels:
    {{- include "callman.labels" (dict "root" $ "component" "worker") | nindent 4 }}
spec:
  minAvailable: {{ .Values.worker.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "callman.selectorLabels" (dict "root" $ "component" "worker") | nindent 6 }}
{{- end }}
