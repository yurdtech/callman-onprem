apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "callman.fullname" . }}-admin-env
  labels:
    {{- include "callman.labels" (dict "root" $ "component" "admin") | nindent 4 }}
data:
  NODE_ENV: production
  # Fixed: the image healthcheck and SPA serving are baked to 5100.
  PORT: "5100"
  CALLMAN_DB_WRITE_ENABLED: {{ .Values.admin.dbWriteEnabled | quote }}
  RATE_LIMIT_MAX: {{ .Values.admin.rateLimitMax | quote }}
  CALLMAN_BACKEND_API_URL: {{ include "callman.backendApiUrl" . | quote }}
  {{- with .Values.admin.corsOrigins }}
  CORS_ORIGINS: {{ . | quote }}
  {{- end }}
