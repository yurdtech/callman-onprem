apiVersion: v2
name: callman
description: >-
  Callman on-prem platform — API backend, scenario worker, optional UI-test
  runner, admin panel, and optional bundled MongoDB/Redis. Kubernetes/OpenShift
  alternative to the docker-compose deployment in this repository.
type: application
# Chart version: bumped for any template/values change, independent of app versions.
version: 0.1.0
# appVersion = CALLMAN_VERSION: default image tag for backend / worker / migrate
# / ui-runner. The admin panel image is pinned separately in values.yaml
# (admin.image.tag) — each chart release ships a known-good pair.
appVersion: "1.0.1"
keywords:
  - callman
  - api-testing
  - on-prem
home: https://github.com/yurdtech/callman-onprem
maintainers:
  - name: yurdtech
    email: info@yurdtech.com
