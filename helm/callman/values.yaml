# Callman Helm chart values.
#
# Key names mirror the docker-compose .env variables wherever one exists
# (docs/HELM-INSTALL.md carries the full .env → values mapping table), so a
# compose installation can be translated line by line.

global:
  # Airgap: prefix EVERY image with an internal registry. The source registry
  # host is replaced, the repository path is kept (see callman.image helper):
  #   registry.bank.local + ghcr.io/yurdtech/callman-backend
  #     -> registry.bank.local/yurdtech/callman-backend
  imageRegistry: ""
  # Names of pre-created dockerconfigjson secrets (GHCR is private).
  imagePullSecrets: []

# Convenience for evaluation installs: render a dockerconfigjson pull secret
# from inline credentials. Production/airgap installs pre-create their own
# secret and list it under global.imagePullSecrets instead.
imageCredentials:
  create: false
  registry: ghcr.io
  username: ""
  password: ""

# ---------------------------------------------------------------------------
# Secrets — two mutually exclusive paths, NO auto-generation.
#
# 1) existingSecret: name of a customer-managed Secret whose keys are the env
#    names below (recommended for banks / Vault / SealedSecrets pipelines).
#    Optional keys MONGODB_URI, REDIS_URL, CALLMAN_MONGODB_URI override the
#    chart-constructed URIs.
# 2) values: inline values -> the chart renders its own Secret and validates
#    them at template time (>=32 chars, backend four mutually distinct,
#    admin two distinct) — the preflight.sh equivalent.
# ---------------------------------------------------------------------------
secrets:
  existingSecret: ""
  values:
    JWT_SECRET: ""
    JWT_REFRESH_SECRET: ""
    SESSION_TOKEN_ENCRYPTION_SECRET: ""
    CONNECTION_ENCRYPTION_KEY: ""   # shared backend + admin, byte-identical
    ADMIN_JWT_SECRET: ""
    ADMIN_JWT_REFRESH_SECRET: ""
    ADMIN_BOOTSTRAP_EMAIL: ""
    ADMIN_BOOTSTRAP_PASSWORD: ""
    MONGO_ROOT_PASSWORD: ""         # bundled mongo only
    REDIS_PASSWORD: ""              # bundled redis only

# ---------------------------------------------------------------------------
# Data stores — bundled (compose profiles bundled-mongo / bundled-redis) or
# external. Exactly one of {mongo.enabled, externalMongo.uri} must be set;
# same for redis.
# ---------------------------------------------------------------------------
mongo:
  enabled: true
  image:
    repository: mongo
    tag: "7"
  auth:
    rootUsername: callman           # ≈ MONGO_ROOT_USERNAME
  persistence:
    size: 20Gi
    storageClass: ""
  resources: {}
  # UID overrides. Defaults: OpenShift — unset (SCC assigns); vanilla k8s —
  # runAsUser/fsGroup 999 (the image's mongodb user).
  podSecurityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

externalMongo:
  # ≈ MONGODB_URI. Full URI including credentials; wins over the bundled store.
  # Private-CA TLS: append &tls=true&tlsCAFile=/certs/<file> and provide the
  # PEM via certs.* below.
  uri: ""

redis:
  enabled: true
  image:
    repository: redis
    tag: 7-alpine
  persistence:
    size: 5Gi
    storageClass: ""
  resources: {}
  podSecurityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

externalRedis:
  # ≈ REDIS_URL. Must point at a noeviction-configured Redis 6+.
  url: ""

# ---------------------------------------------------------------------------
# Application tier
# ---------------------------------------------------------------------------
backend:
  image:
    repository: ghcr.io/yurdtech/callman-backend
    tag: ""                         # "" -> Chart.appVersion (≈ CALLMAN_VERSION)
  port: 8080                        # ≈ CALLMAN_PORT
  replicaCount: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
  # V8 old-space cap (NODE_OPTIONS=--max-old-space-size). Node sizes its heap
  # from the NODE's RAM, not the container's limit, so without this the
  # kernel OOM-kills the pod (silently — no log line) before V8 ever runs a
  # full GC. Keep ~25% of resources.limits.memory free for native memory,
  # buffers and the Mongo/Redis drivers.
  heapMb: 768
  # Mongo connection pool PER REPLICA. The code default (100) is sized for a
  # single PM2 host; on k8s every API replica, worker and runner pod opens
  # its own pool against one Mongo, so keep these small.
  mongoPool:
    max: 20
    min: 2
  metricsEnabled: true              # ≈ METRICS_ENABLED
  logLevel: info                    # ≈ LOG_LEVEL (debug|info|warn|error); probes/scrapes log at debug
  clientOrigin: ""                  # ≈ CLIENT_ORIGIN (CSV of extra CORS origins)
  # ≈ PUBLIC_API_BASE_URL. SET IT once desktop auto-update is in use: it is the
  # address every desktop is told to fetch updates from. Empty means the backend
  # guesses it from each request, and behind an ingress that does not forward
  # X-Forwarded-Proto that yields http:// — which the macOS updater refuses.
  publicApiBaseUrl: ""
  # ≈ MOCK_PUBLIC_BASE_URL. Legacy; prefer mock.publicUrl (same meaning).
  mockPublicBaseUrl: ""
  # ── Desktop auto-update (see docs/DESKTOP-APP.md) ────────────────────────
  # ≈ ONPREM_COMPANY_SLUG. The SECOND half of the foreign-build check. The first
  # half is `publicApiBaseUrl` above: a build carries the API address it was made
  # for, so with that set a build belonging to another deployment is already
  # refused. This adds the company name on top, which matters when two
  # deployments answer on the same host. Worth setting; not load-bearing on its
  # own. Must match `company` in the delivered build-manifest.json.
  onpremCompanySlug: ""
  # ≈ HTTP_REQUEST_TIMEOUT_MS. Node applies it to the whole request INCLUDING
  # the body, so the 120000 default cuts an installer upload off part-way.
  # QUOTED deliberately: Helm parses a bare 1800000 as a float64 and renders it
  # as "1.8e+06" in the ConfigMap. The backend's coercion happens to accept that,
  # but an operator reading `kubectl get cm` should not have to.
  httpRequestTimeoutMs: "1800000"
  # Any other backend env var from docs/ENVIRONMENT.md (string values).
  extraEnv: {}
  terminationGracePeriodSeconds: 45
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  pdb:
    enabled: false
    minAvailable: 1
  ingress:
    enabled: false
    className: ""
    host: ""
    annotations: {}
    tls: []                         # standard networking.k8s.io/v1 tls list
  route:
    enabled: false
    host: ""
    annotations: {}
    tls:
      termination: edge             # edge | reencrypt | passthrough

worker:
  replicaCount: 1
  healthPort: 9090                  # ≈ WORKER_HEALTH_PORT
  # ≈ SHUTDOWN_TIMEOUT_MS — how long in-flight scenario runs may finish on a
  # rollout before the process force-exits; terminationGracePeriodSeconds is
  # derived from it (+15 s). 120 s covers the 99th-percentile run.
  shutdownTimeoutMs: 120000
  # ≈ BULLMQ_WORKER_CONCURRENCY. Concurrency is the ONLY backpressure on the
  # worker's memory: 50 parallel runs that each stream multi-MB responses
  # through loop nodes do not fit a 1.5 GiB pod. 20 keeps throughput for
  # I/O-bound runs while the heap-watermark guard (WORKER_HEAP_HIGH_WATERMARK)
  # defers pickup when memory gets tight. Raise together with heapMb/limits.
  concurrency: 20
  heapMb: 1024                      # NODE_OPTIONS=--max-old-space-size (see backend.heapMb)
  mongoPool:
    max: 30                         # ≈ concurrency + headroom for schedule sync
    min: 2
  # Mounting the backups PVC into workers (compose parity for operator-run
  # mongodump) requires ReadWriteMany storage — see docs/HELM-INSTALL.md.
  mountBackups: false
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1536Mi
  extraEnv: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  pdb:
    enabled: false
    minAvailable: 1
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    # "cpu"   — scale on CPU utilisation (works out of the box).
    # "queue" — scale on BullMQ queue depth (`bullmq_jobs_waiting`, exported
    #           on every worker's /metrics). Requires a metrics adapter that
    #           serves it through the External Metrics API (prometheus-adapter)
    #           — see docs/SCALING.md. Scenario runs are I/O-bound, so queue
    #           depth is the honest signal; CPU rarely moves.
    metric: cpu
    targetCPUUtilizationPercentage: 75
    targetWaitingJobsPerReplica: 10
  # Queue-driven autoscaling with KEDA (https://keda.sh, must be installed in
  # the cluster) — the recommended way to scale workers: it reads the
  # scenario-runs backlog straight from Redis (no Prometheus / metrics adapter
  # needed). Mutually exclusive with worker.hpa. replicas = max(
  #   waiting jobs / waitingPerReplica,  active jobs / worker.concurrency)
  # so a burst of schedules / CI runs adds pods within ~pollingInterval and
  # pods are only removed after cooldownPeriod of quiet. See docs/SCALING.md.
  keda:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    # Waiting jobs one more pod should absorb ("" = worker.concurrency).
    waitingPerReplica: ""
    pollingInterval: 5               # seconds between backlog checks
    cooldownPeriod: 300              # seconds of no backlog before scaling in
    scaleDownStabilizationSeconds: 300

# Database connection pooling for scenario DB steps (≈ DB_POOL_*). On, steps
# that hit the same database share warm pooled connections per pod instead of
# logging in for every step — a 450-run burst then opens at most
# pods × maxPerConnection connections to that database. Off = one fresh
# connection per step (the behaviour before pooling; useful for an A/B lab).
dbPool:
  enabled: true                     # ≈ DB_POOL_ENABLED
  maxPerConnection: 10              # ≈ DB_POOL_MAX_PER_CONNECTION, per pod
  idleMs: 60000                     # ≈ DB_POOL_IDLE_MS
  acquireTimeoutMs: 30000           # ≈ DB_POOL_ACQUIRE_TIMEOUT_MS

# Load Testing Lab (admin panel → "Load Testing Lab"): fire N × scenario runs
# at the same instant across the worker pods and report the result. Labs run
# on every worker that consumes the load-lab queues — by default the regular
# `worker` pods. Enable `loadLabWorker` to give labs their own pods so a
# 700-run burst never competes with production schedules / CI runs.
loadLab:
  enabled: true                     # ≈ LOAD_LAB_ENABLED (API + lab consumers)
  maxTotalRuns: 2000                # ≈ LOAD_LAB_MAX_TOTAL_RUNS — largest lab
  # ≈ LOAD_LAB_MAX_RUNS_PER_POD — runs one pod fires at once. Burst mode
  # refuses a lab larger than (lab pods × this). A typical API/DB scenario
  # holds ~2–8 MB of heap while running: 150 fits the 1 GiB worker heap.
  maxRunsPerPod: 150
  armTimeoutMs: 60000               # ≈ LOAD_LAB_ARM_TIMEOUT_MS
  startLeadMs: 3000                 # ≈ LOAD_LAB_START_LEAD_MS
  samplesPerGroup: 3                # ≈ LOAD_LAB_SAMPLES_PER_GROUP
  # The regular worker pods also take lab shards (WORKER_QUEUES includes
  # load-lab). Set false together with loadLabWorker.enabled=true to keep
  # labs off the production workers entirely.
  onRegularWorkers: true

# Dedicated load-lab pods (same backend image, WORKER_QUEUES=load-lab). Scale
# replicaCount to the capacity a lab needs before it starts:
#   pods = ceil(total runs / loadLab.maxRunsPerPod)  (perPod below overrides)
loadLabWorker:
  enabled: false
  replicaCount: 2
  healthPort: 9092
  shutdownTimeoutMs: 120000
  # Overrides loadLab.maxRunsPerPod for these pods ("" = inherit).
  maxRunsPerPod: ""
  heapMb: 2048
  # libuv thread pool. Oracle Thick mode (11g targets) runs EVERY Oracle call
  # on it, so it caps the Oracle calls in flight per pod — raise it with the
  # burst size (DNS lookups of HTTP steps share it too).
  uvThreadpoolSize: 32
  # ≈ SCRIPT_WORKER_POOL_SIZE (0–16): warm threads that run the script steps of
  # the burst's runs. More than the regular worker's 2 — 150 runs per pod share it.
  scriptWorkerPoolSize: 8
  mongoPool:
    max: 20
    min: 2
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 3Gi
  extraEnv: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # KEDA for the lab pods: a lab cuts its runs into shards (one per pod,
  # ceil(runs / maxRunsPerPod), at most maxReplicas) and every waiting shard
  # job adds a pod; the burst fires once they are all up. Requires KEDA.
  keda:
    enabled: false
    minReplicas: 1                   # >= 1: the lab coordinator runs on these pods
    maxReplicas: 10
    pollingInterval: 5
    cooldownPeriod: 600
    # How long a lab waits for its pods (image pull + start) before it fires
    # on the ones that came up (≈ LOAD_LAB_ARM_TIMEOUT_MS).
    scaleUpTimeoutMs: 300000

# Redis connection KEDA's scalers use to read the BullMQ queue lengths.
# Defaults follow the bundled Redis; for externalRedis set address (and
# enableTLS) here — the password is read from the release Secret.
keda:
  redis:
    address: ""                      # host:port reachable from the KEDA operator; "" = <release>-redis.<namespace>.svc:6379
    passwordSecretKey: REDIS_PASSWORD
    enableTLS: false
    # BullMQ key prefix (Callman uses BullMQ's default).
    keyPrefix: bull

uiRunner:                           # ≈ COMPOSE_PROFILES ui-runner
  enabled: false
  image:
    repository: ghcr.io/yurdtech/callman-ui-runner
    tag: ""                         # "" -> Chart.appVersion
  replicaCount: 1
  healthPort: 9091                  # ≈ UITEST_HEALTH_PORT
  concurrency: 2                    # ≈ UITEST_WORKER_CONCURRENCY (1-5)
  runMaxDurationMs: 900000          # ≈ UITEST_RUN_MAX_DURATION_MS
  # ≈ SHUTDOWN_TIMEOUT_MS for THIS pod (overrides the shared ConfigMap value):
  # how long in-flight browser runs may finish on a rollout. Browser runs
  # take minutes, not seconds — with the shared 30 s every `helm upgrade`
  # killed every run in flight. terminationGracePeriodSeconds is derived
  # (+30 s). Backend >= 1.1 accepts up to 900000 (= runMaxDurationMs);
  # older images cap it at 120000.
  drainTimeoutMs: 120000
  heapMb: 768                       # Node heap only — Chromium is separate
  mongoPool:
    max: 5
    min: 1
  # Chromium shared memory. Backed by an in-memory emptyDir that COUNTS
  # against the container memory limit. The runner launches Chromium with
  # --disable-dev-shm-usage (backend >= 1.1), so 1Gi is plenty; keep
  # resources.limits.memory >= shmSize + heapMb + ~700Mi per concurrent browser.
  shmSize: 1Gi
  resources:
    requests:
      cpu: 500m                     # required for the CPU HPA to compute a ratio
      memory: 1Gi
    limits:
      memory: 4Gi
  extraEnv: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  pdb:
    enabled: false
    minAvailable: 1
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 75

storage:                            # ≈ COMPOSE_PROFILES storage
  # The gateway for LARGE files (mobile build artifacts, recordings). It is a
  # CONNECTOR: files go to the S3 / MinIO / FileNet connected in the admin panel
  # under Storage, so they stay in your infrastructure and your backup regime.
  # Runs from backend.image — no browser, so no second image to pull.
  enabled: false
  replicaCount: 1                   # stateless, so scale freely (unless localVolume)
  port: 8081                        # ≈ CALLMAN_STORAGE_PORT
  healthPort: 9092                  # ≈ CALLMAN_STORAGE_HEALTH_PORT
  # The address users and CI reach the gateway on, e.g.
  # https://callman.yourbank.local — no trailing slash, no /storage path.
  # Callman puts it in every download link, which is how your provider's own
  # endpoint and credentials never reach a client. REQUIRED in practice.
  publicUrl: ""
  maxUploadBytes: 524288000         # 500 MB; raise the ingress body size to match
  # ≈ SHUTDOWN_TIMEOUT_MS for THIS pod: how long in-flight transfers may finish
  # on a rollout. terminationGracePeriodSeconds is derived (+30 s).
  drainTimeoutMs: 120000
  heapMb: 512                       # streams, so this stays small
  mongoPool:
    max: 5
    min: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  ingress:
    enabled: false
    className: ""
    host: ""                        # may be the SAME host as backend.ingress
    path: /storage
    # The chart sets the body-limit and timeout annotations for you; anything here
    # overrides them.
    annotations: {}
    tls: []
  route:                            # OpenShift; mutually exclusive with ingress
    enabled: false
    host: ""
    # `haproxy.router.openshift.io/timeout: 1h` is set for you; override here.
    annotations: {}
    tls:
      termination: edge             # edge | reencrypt | passthrough
  localVolume:
    # ONLY for the "Local volume" provider, the fallback before an object store
    # is connected. Leave false and connect real storage instead.
    #
    # ⚠ `accessModes` must be ReadWriteMany when this is on. The claim is mounted
    # by the API Deployment as well as the gateway, because desktop release
    # artifacts are written and served by the API process. With ReadWriteOnce the
    # two pods can only both mount it on the same node, and a release uploaded to
    # one would be invisible to the other.
    enabled: false
    mountPath: /var/lib/callman/files
    size: 50Gi
    storageClass: ""
    # RWO caps the gateway at one replica; ReadWriteMany unlocks scaling.
    accessModes:
      - ReadWriteOnce
  extraEnv: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  pdb:
    enabled: false
    minAvailable: 1

mock:                               # the public /mock/* surface (mock-server.js)
  # User-defined mock APIs, served by pods of their own so mock traffic — load
  # tests included — never shares an event loop with the API. Same image as the
  # backend (needs a Callman release that ships dist/mock-server.js), uses the
  # same MongoDB + Redis, stateless.
  #
  # Exposure follows the backend unless forced (see ingress/route below): with
  # no host of its own the mock Ingress/Route joins the backend's host on the
  # /mock path, so `helm upgrade` moves mock traffic to these pods without a
  # DNS change and published mock URLs stay the same. Once that happens the
  # API stops executing mocks (MOCK_SERVE_ON_API=false: it redirects stray
  # /mock requests here). With neither an Ingress nor a Route the API keeps
  # serving mocks as before.
  enabled: true
  replicaCount: 1                   # ignored while hpa.enabled
  port: 8082                        # ≈ CALLMAN_MOCK_PORT
  healthPort: 9093                  # ≈ CALLMAN_MOCK_HEALTH_PORT
  # ≈ MOCK_PUBLIC_BASE_URL — the address users call mocks on, no trailing slash,
  # no /mock path. "" = derived: the mock Ingress/Route's own host, or the
  # backend's public URL when they share a host.
  publicUrl: ""
  # Per-pod, per-IP flood fuse in requests/second (≈ MOCK_IP_RATE_LIMIT_PER_SECOND,
  # 0 = off). Every request counts, unknown mock ids included. Per-mock limits
  # are separate and cluster-wide.
  ipRateLimitPerSecond: 300
  # Mock engine v2 limits: resources (a small database per mock), test
  # sessions, imports. Rendered into the SHARED env (not only the mock pods):
  # the API checks definitions and imports against them and still serves
  # /mock/* until the mock pods are routed. Data lives in the mockRecords /
  # mockNamespaces collections and expires with its mock. See docs/MOCK-SERVER.md.
  limits:
    maxResourcesPerMock: 20         # ≈ MOCK_MAX_RESOURCES_PER_MOCK (1-50)
    maxRecordsPerResource: 1000     # ≈ MOCK_MAX_RECORDS_PER_RESOURCE, per namespace
    maxRecordsPerNamespace: 5000    # ≈ MOCK_MAX_RECORDS_PER_NAMESPACE (shared data, or one session)
    maxRecordBytes: 16384           # ≈ MOCK_MAX_RECORD_BYTES, one record's JSON
    maxSeedBytes: 524288            # ≈ MOCK_MAX_SEED_BYTES, a mock's seed records together
    maxSessionsPerMock: 20          # ≈ MOCK_MAX_SESSIONS_PER_MOCK, active X-Mock-Session ids
    sessionIdleTtlMinutes: 60       # ≈ MOCK_SESSION_IDLE_TTL_MINUTES (5-1440)
    maxDataOpsPerRequest: 25        # ≈ MOCK_MAX_DATA_OPS_PER_REQUEST (5-200)
    dataQueryTimeoutMs: 2000        # ≈ MOCK_DATA_QUERY_TIMEOUT_MS, Mongo maxTimeMS per data query
    # ≈ MOCK_MAX_IMPORT_BYTES (2 MB), the largest file POST /api/import/mocks
    # accepts. Its request is up to ~1.5x the file: behind an nginx Ingress raise
    # backend.ingress.annotations nginx.ingress.kubernetes.io/proxy-body-size.
    maxImportBytes: 2097152
  # ≈ SHUTDOWN_TIMEOUT_MS for THIS pod. Mock responses may be delayed by up to
  # 60 s; terminationGracePeriodSeconds is derived (+15 s).
  drainTimeoutMs: 75000
  heapMb: 384
  mongoPool:
    max: 10
    min: 1
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      memory: 512Mi
  # Any other backend env var from docs/ENVIRONMENT.md (string values), e.g.
  # MOCK_DEFAULT_RATE_LIMIT_PER_SECOND for load tests against mocks.
  extraEnv: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  pdb:
    enabled: false
    minAvailable: 1
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  ingress:
    enabled: ""                     # "" = same as backend.ingress.enabled; true/false forces
    className: ""                   # "" = backend.ingress.className
    host: ""                        # "" = backend.ingress.host (path split); set for a mock domain
    path: /mock                     # the mock URLs' path — keep it
    # Timeouts (120 s, delays go to 60 s) and a 2 MB body limit are set for you;
    # anything here overrides them.
    annotations: {}
    tls: []                         # "" host → the backend's tls list is reused
  route:                            # OpenShift; mutually exclusive with ingress
    # "" = same as backend.route.enabled, but only when a host is known
    # (mock.route.host or backend.route.host): OpenShift generates a different
    # host per Route, so the /mock path cannot join an unnamed backend host.
    enabled: ""
    host: ""                        # "" = backend.route.host; set for a mock domain
    # `haproxy.router.openshift.io/timeout: 120s` is set for you; override here.
    annotations: {}
    tls:
      termination: edge             # edge | reencrypt | passthrough

admin:
  image:
    repository: ghcr.io/yurdtech/callman-onprem-admin
    # Pinned per chart release (≈ CALLMAN_ADMIN_VERSION) — the admin/backend
    # pair below is what this chart version was tested with.
    tag: "1.0.5"
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  dbWriteEnabled: false             # ≈ CALLMAN_DB_WRITE_ENABLED
  corsOrigins: ""                   # ≈ CORS_ORIGINS (empty -> same-origin SPA only)
  rateLimitMax: 300                 # ≈ RATE_LIMIT_MAX
  # ≈ CALLMAN_BACKEND_API_URL. Empty -> in-cluster backend service URL.
  backendApiUrl: ""
  # ≈ CALLMAN_MONGODB_URI. Empty -> same URI as the backend.
  mongodbUri: ""
  extraEnv: {}
  terminationGracePeriodSeconds: 30
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  ingress:
    enabled: false
    className: ""
    host: ""
    # The chart already sets the body-limit and timeout annotations this surface
    # needs — it carries desktop installer uploads of up to 2 GB. Anything you put
    # here WINS over them; you do not need to repeat them.
    annotations: {}
    tls: []
  route:
    enabled: false
    host: ""
    # Same: `haproxy.router.openshift.io/timeout: 1h` is set for you. Override it
    # here if your uploads need longer than an hour.
    annotations: {}
    tls:
      termination: edge

# ---------------------------------------------------------------------------
# Migrations (one-shot Job per Helm revision) + pre-migration backup storage
# ---------------------------------------------------------------------------
migrate:
  backup:
    enabled: true                   # false ≈ SKIP_MIGRATION_BACKUP=1
  backoffLimit: 10
  ttlSecondsAfterFinished: 86400
  resources: {}

backup:
  persistence:
    size: 10Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce               # ReadWriteMany required for worker.mountBackups

# Private-CA PEMs mounted read-only at /certs in every app container, so URIs
# like ...&tlsCAFile=/certs/mongo-ca.pem keep working (compose ./certs parity).
certs:
  existingConfigMap: ""
  files: {}
  #  mongo-ca.pem: |
  #    -----BEGIN CERTIFICATE-----

serviceAccount:
  create: true
  name: ""
  annotations: {}

# OpenShift handling. "" = auto-detect (the route.openshift.io API group on
# the target cluster). On OpenShift no UIDs are pinned (the restricted-v2 SCC
# assigns them); on vanilla k8s numeric runAsUser/fsGroup defaults are applied
# (app images 1000, mongo/redis 999). Force with true/false if detection is
# not possible (e.g. rendering manifests offline for an OpenShift cluster).
openshift:
  enabled: ""

# Vanilla-k8s UID overrides for app pods (ignored on OpenShift unless set).
podSecurityContext: {}
#  runAsUser: 1000
#  fsGroup: 1000

networkPolicy:
  enabled: false

serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}

commonLabels: {}
