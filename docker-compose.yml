# ─────────────────────────────────────────────────────────────────────
# Callman — on-prem stack.
#
# ALL-IN-ONE by default: the Callman backend runs from a pre-built
# registry image alongside a bundled MongoDB + Redis, so a single
# `docker compose up -d` gives a working install. No source is built
# here — images are pulled by version tag.
#
# YOUR OWN DATABASES: you never edit this file. Change `.env` only —
# drop the bundled profile and set MONGODB_URI / REDIS_URL. Full guide:
# docs/EXTERNAL-DATABASES.md
#
# Quick start:
#     git clone https://github.com/yurdtech/callman-onprem.git
#     cd callman-onprem
#     cp .env.example .env     # fill in CALLMAN_VERSION + secrets
#     ./scripts/preflight.sh   # catches config mistakes before you start
#     docker compose pull
#     docker compose up -d
#     curl http://localhost:${CALLMAN_PORT}/health
#
# Requires Docker Compose v2.20+ (for `depends_on: required:`).
# Full guide: docs/INSTALL.md
# ─────────────────────────────────────────────────────────────────────

name: callman

# Shared backend image config (HTTP server, worker, and migrate are the
# same image, different commands).
#
# `extra_hosts` makes `host.docker.internal` resolve to the Docker host on
# Linux too — needed when your MongoDB/Redis runs on this same machine but
# OUTSIDE Docker. (Inside a container, "localhost" is the container itself,
# so a URI pointing at localhost would never reach your database.)
#
# `./certs` is mounted read-only into every app container so a private-CA
# certificate works with NO edit to this file: drop your PEM in ./certs and
# reference it as /certs/<name>.pem from .env (Mongo `tlsCAFile=`). The
# directory ships empty. (An LDAP CA does NOT go here — you paste it into the
# admin panel; see docs/AUTH_SETUP.md.)
x-app: &app
  image: ghcr.io/yurdtech/callman-backend:${CALLMAN_VERSION:?set CALLMAN_VERSION in .env}
  env_file:
    - .env
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./certs:/certs:ro

# DB/cache connection strings.
#
# The value from your `.env` ALWAYS WINS. If you leave MONGODB_URI /
# REDIS_URL unset (the default), the URI is constructed from the bundled
# passwords below so it always matches the bundled mongo/redis services —
# you never hand-write a connection URI for the default install.
#
# To use your own databases, set MONGODB_URI / REDIS_URL in `.env` and
# remove the matching profile from COMPOSE_PROFILES. Nothing here changes.
# See docs/EXTERNAL-DATABASES.md.
x-db-env: &db-env
  MONGODB_URI: ${MONGODB_URI:-mongodb://${MONGO_ROOT_USERNAME:-callman}:${MONGO_ROOT_PASSWORD:-}@mongo:27017/callman?authSource=admin}
  REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:-}@redis:6379}

# DB readiness ordering. `required: false` means "wait for it IF it is part
# of this deployment" — so when the bundled profiles are off and there is no
# mongo/redis service, these dependencies are simply skipped instead of
# being an error. That is what lets one compose file serve both layouts.
x-db-depends: &db-depends
  mongo:
    condition: service_healthy
    required: false
  redis:
    condition: service_healthy
    required: false

services:
  # One-shot schema migration. Backs up the DB (mongodump → /backups) and
  # applies pending migrations, then exits. The app waits for it.
  migrate:
    <<: *app
    container_name: callman-migrate
    command: ["node", "dist/migrations/cli.js", "up"]
    restart: "no"
    environment: *db-env
    volumes:
      - ./certs:/certs:ro
      - backups:/backups
    # The image bakes a liveness probe for the HTTP server, which this
    # one-shot job never starts. Without this, migrate would sit at
    # "unhealthy" after a perfectly successful run.
    healthcheck:
      disable: true
    depends_on: *db-depends

  backend:
    <<: *app
    container_name: callman-backend
    command: ["node", "dist/server.js"]
    init: true
    environment:
      # Single source for the port: the API binds to it AND it is published
      # below — so the URL you curl is the URL the app listens on.
      <<: *db-env
      PORT: ${CALLMAN_PORT:-8080}
    ports:
      - "${CALLMAN_PORT:-8080}:${CALLMAN_PORT:-8080}"
    depends_on:
      <<: *db-depends
      migrate:
        condition: service_completed_successfully
    # Overrides the image's baked probe, which targets the image default
    # port (4000) rather than your CALLMAN_PORT.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${CALLMAN_PORT:-8080}/health/live"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Background job processor (scenario runs + schedules). Deliberately has
  # NO `container_name` so it can be scaled to many replicas under load:
  #   docker compose up -d --scale worker=N
  # A fixed name would make Compose refuse the 2nd replica ("name already in
  # use"). Replicas are auto-named callman-worker-1, callman-worker-2, …
  # All replicas share one Redis/BullMQ queue and BullMQ spreads jobs across
  # them; per-schedule redlock keeps any one schedule from running twice.
  # See docs/SCALING.md.
  worker:
    <<: *app
    command: ["node", "dist/worker.js"]
    init: true
    environment: *db-env
    volumes:
      - ./certs:/certs:ro
      - backups:/backups
    depends_on:
      <<: *db-depends
      migrate:
        condition: service_completed_successfully
    # The worker serves no HTTP API — its probes live on a dedicated port
    # (WORKER_HEALTH_PORT, default 9090). Without this override it would
    # inherit the image's probe against port 4000 and report "unhealthy"
    # forever while working perfectly.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${WORKER_HEALTH_PORT:-9090}/health/live"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── UI-test runner (optional, profile "ui-runner") ─────────────────
  # Executes WEB UI test flows on a schedule in headless Chromium. A
  # SEPARATE, browser-capable image (~2 GB — the backend image is Alpine
  # and cannot host a browser), so it is opt-in via COMPOSE_PROFILES.
  # Budget ~2 GB RAM per replica; parallel browsers = replicas ×
  # UITEST_WORKER_CONCURRENCY (default 2). Scale like the worker:
  #   docker compose up -d --scale ui-runner=N
  # (deliberately NO container_name, same reasoning as the worker).
  # Without this service running, the app answers "UI runner unavailable"
  # to schedule/run requests — nothing else breaks. See docs/SCALING.md.
  ui-runner:
    image: ghcr.io/yurdtech/callman-ui-runner:${CALLMAN_VERSION:?set CALLMAN_VERSION in .env}
    profiles: ["ui-runner"]
    env_file:
      - .env
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # tini as PID 1 — reaps orphaned Chromium processes.
    init: true
    # Chromium needs a real /dev/shm; the 64 MB Docker default crashes tabs.
    shm_size: "2gb"
    environment:
      <<: *db-env
      CALLMAN_WEB_DRIVER_NO_SANDBOX: "1"
    volumes:
      - ./certs:/certs:ro
    depends_on:
      <<: *db-depends
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.WORKER_HEALTH_PORT||9090)+'/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Bundled data stores (optional) ─────────────────────────────────
  # Enabled by COMPOSE_PROFILES in .env (default: both on). Remove a
  # profile there to use your own database instead — see
  # docs/EXTERNAL-DATABASES.md. Neither is published to the host; only the
  # app containers reach them over the internal network.

  # Bundled MongoDB (standalone — the backend uses no multi-document
  # transactions, so a replica set is NOT required).
  mongo:
    image: mongo:7
    container_name: callman-mongo
    profiles: ["bundled-mongo"]
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-callman}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # `ping` is allowed pre-auth, so no credentials needed here.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Bundled Redis. `noeviction` is CRITICAL — BullMQ stores jobs in Redis
  # and must never have them evicted under memory pressure. `appendonly`
  # persists across restarts. Password-protected.
  redis:
    image: redis:7-alpine
    container_name: callman-redis
    profiles: ["bundled-redis"]
    restart: unless-stopped
    environment:
      # Also exposed as an env var (not just the --requirepass argument below)
      # so admin commands can authenticate from inside the container without
      # you having to retype the password:
      #   docker compose exec -T redis sh -c \
      #     'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping'
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--maxmemory-policy"
      - "noeviction"
      - "--requirepass"
      - "${REDIS_PASSWORD:-}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # On-prem admin panel — ONE image (NestJS API + bundled React SPA served
  # same-origin on a single port), built from the DEDICATED
  # callman-onprem-admin-panel repo (the on-prem-only admin with org groups,
  # activity log, group access, dashboard analytics). It is INDEPENDENT of
  # backend/worker: it talks DIRECTLY to the SAME MongoDB, with its OWN
  # auth + JWT secrets, and never calls the backend API. It uses no Redis.
  # By default it can only READ Callman data (CALLMAN_DB_WRITE_ENABLED=false).
  admin:
    image: ghcr.io/yurdtech/callman-onprem-admin:${CALLMAN_ADMIN_VERSION:?set CALLMAN_ADMIN_VERSION in .env}
    container_name: callman-admin
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./certs:/certs:ro
    environment:
      # Internal port is fixed at 5100 (matches the image's baked HEALTHCHECK).
      PORT: 5100
      # Follows the SAME Mongo as the backend automatically — bundled or
      # yours. Set CALLMAN_MONGODB_URI in .env only if the admin panel must
      # use a DIFFERENT Mongo than the backend (unusual; it reads the same
      # database).
      CALLMAN_MONGODB_URI: ${CALLMAN_MONGODB_URI:-${MONGODB_URI:-mongodb://${MONGO_ROOT_USERNAME:-callman}:${MONGO_ROOT_PASSWORD:-}@mongo:27017/callman?authSource=admin}}
    ports:
      - "${CALLMAN_ADMIN_PORT:-5100}:5100"
    depends_on:
      # Hard requirement: admin connects directly to Mongo on boot — but
      # only wait for the bundled one when it is part of this deployment.
      mongo:
        condition: service_healthy
        required: false
      # Wait for the one-shot migrate so admin reads an already-migrated
      # schema (it shares the DB). This is DB-readiness ordering, NOT a
      # dependency on the backend/worker app tier — admin never calls the
      # backend API.
      migrate:
        condition: service_completed_successfully

volumes:
  mongo_data:
  redis_data:
  backups:
